<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title-gallery">Chassis Kampenhout – Galerij</title>
    <link rel="stylesheet" href="style_light.css">
</head>
<body>
<header class="site-header">
    <div class="logo">
        <span class="logo-mark">CK</span>
        <span class="logo-text" id="logo-text">Chassis Kampenhout</span>
    </div>
    <nav>
        <a href="index.html" id="nav-home">Home</a>
        <a href="diensten.html" id="nav-diensten">Diensten</a>
        <a href="galerij.html" class="active" id="nav-galerij">Galerij</a>
        <a href="contact.html" id="nav-contact">Contact</a>
        <button id="theme-toggle">🌙</button>
    </nav>
    <select id="lang-select">
        <option value="nl">NL</option>
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="pl">PL</option>
    </select>
</header>

<main class="section fade-in">
    <h1 id="gallery-title">Galerij</h1>
    <p id="gallery-sub">Enkele voorbeelden van uitgevoerde werken.</p>

    <div class="gallery-grid">
        <div class="gallery-item">
            <img src="images/chassis1.png" alt="Raam herstelling 1">
            <span id="gallery-item1">Raam herstelling</span>
        </div>
        <div class="gallery-item">
            <img src="images/chassis2.jpg" alt="Raam herstelling 2">
            <span id="gallery-item2">Laswerk aan frame</span>
        </div>
        <div class="gallery-item">
            <img src="images/chassis3.jpg" alt="Raam herstelling 3">
            <span id="gallery-item3">Roestbehandeling</span>
        </div>
        <div class="gallery-item">
            <img src="images/chassis4.jpg" alt="Raam herstelling 4">
            <span id="gallery-item4">Aanhangwagen versteviging</span>
        </div>
    </div>
</main>

<footer class="site-footer">
    <p id="footer-text">© 2026 Chassis Kampenhout (Lewiu) – Alle rechten voorbehouden</p>
</footer>

<script src="script.js"></script>
</body>
</html>
